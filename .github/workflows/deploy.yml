name: 🚀 CI/CD — Build & Deploy to VPS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '8.0.x'
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/YOUR_PROJECT_NAME-backend

jobs:
  # ============================================
  # Job 1: Build & Test (بيشتغل على PR و Main)
  # ============================================
  build-and-test:
    runs-on: ubuntu-latest
    name: 🔨 Build & Test

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restore dependencies
        run: dotnet restore src/YourProject.Api/YourProject.Api.csproj

      - name: 🔨 Build
        run: dotnet build src/YourProject.Api/YourProject.Api.csproj --no-restore --configuration Release

      - name: 🧪 Run tests
        run: dotnet test --no-build --verbosity normal
        continue-on-error: true  # لو مفيش tests لسه، مايوقفش الـ pipeline

  # ============================================
  # Job 2: Docker Build & Push (بس على Main)
  # ============================================
  docker-build-push:
    runs-on: ubuntu-latest
    name: 🐳 Docker Build & Push
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏷️ Generate image tag
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "full_image=${{ env.IMAGE_NAME }}:$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: 🐳 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.full_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📤 Output image tag
        run: echo "Deployed image -> ${{ steps.meta.outputs.full_image }}"

  # ============================================
  # Job 3: Deploy to VPS (بس على Main)
  # ============================================
  deploy:
    runs-on: ubuntu-latest
    name: 🚀 Deploy to VPS
    needs: docker-build-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 🔐 Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: 🚀 Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          IMAGE_TAG: ${{ needs.docker-build-push.outputs.tag }}
        run: |
          # Add host to known hosts
          mkdir -p ~/.ssh
          ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts

          # Deploy via SSH
          ssh $VPS_USER@$VPS_HOST << 'EOF'
            set -e
            cd /opt/YOUR_PROJECT_NAME
            
            # Update the image tag in .env
            echo "BACKEND_IMAGE=${{ env.IMAGE_NAME }}:${{ github.sha }}" > .env
            
            # Pull the new image
            docker compose pull backend
            
            # Start/Recreate containers
            docker compose up -d
            
            # Cleanup old images
            docker image prune -f
            
            # Wait for backend healthcheck
            echo "⏳ Waiting for backend to be healthy..."
            sleep 15
            
            # Check health
            if docker inspect --format='{{.State.Health.Status}}' backend | grep -q "healthy"; then
              echo "Backend is healthy!"
            else
              echo "Backend health check failed!"
              docker compose logs backend --tail 50
              exit 1
            fi
            
            echo "Deployment successful!"
          EOF